x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expertiza-frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    logging: *default-logging

  frontend-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: expertiza-frontend:dev
    container_name: expertiza-frontend-dev
    environment:
      VITE_FORCE_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "${CHOKIDAR_INTERVAL:-500}"
      VITE_DEV_PROXY_TARGET: "${VITE_DEV_PROXY_TARGET:-http://host.docker.internal:3002}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${VITE_DEV_PORT:-3000}:3000"
    volumes:
      - .:/app
      - frontend-node-modules:/app/node_modules
    restart: unless-stopped
    logging: *default-logging

volumes:
  frontend-node-modules:
