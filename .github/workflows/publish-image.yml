name: Publish frontend container image

on:
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    name: Prepare image publication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image_name: ${{ steps.version.outputs.image_name }}
      package_version: ${{ steps.version.outputs.package_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      is_release: ${{ steps.version.outputs.is_release }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      sha_tag: ${{ steps.version.outputs.sha_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Determine package and release versions
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          package_version=$(node --print "require('./package.json').version")
          image_name=$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          release_tag="v${package_version}"
          sha_tag="sha-${GITHUB_SHA::7}"
          is_release=false
          is_release_branch=false
          is_prerelease=false

          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            is_release_branch=true
          fi

          VERSION="$package_version" node <<'NODE'
          const version = process.env.VERSION;
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?$/;

          if (!semver.test(version)) {
            console.error(
              `package.json contains an unsupported release version: ${version}. ` +
                "Use SemVer without build metadata (+...).",
            );
            process.exit(1);
          }
          NODE

          if ! git check-ref-format "refs/tags/${release_tag}" >/dev/null; then
            echo "Version ${package_version} cannot be used as a Git tag." >&2
            exit 1
          fi

          if [[ "$package_version" == *-* ]]; then
            is_prerelease=true
          fi

          if [[ ! "$BEFORE_SHA" =~ ^0+$ ]] && git cat-file -e "${BEFORE_SHA}:package.json" 2>/dev/null; then
            previous_version=$(git show "${BEFORE_SHA}:package.json" | node -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => console.log(JSON.parse(input).version));
            ')

            if [[ "$is_release_branch" == "true" && "$package_version" != "$previous_version" ]]; then
              is_release=true
            fi
          fi

          {
            echo "image_name=$image_name"
            echo "package_version=$package_version"
            echo "release_tag=$release_tag"
            echo "sha_tag=$sha_tag"
            echo "is_release=$is_release"
            echo "is_release_branch=$is_release_branch"
            echo "is_prerelease=$is_prerelease"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Build and publish image
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish-frontend-${{ needs.prepare.outputs.is_release == 'true' && needs.prepare.outputs.release_tag || needs.prepare.outputs.sha_tag }}
      cancel-in-progress: false
    outputs:
      image_name: ${{ needs.prepare.outputs.image_name }}
      is_release: ${{ needs.prepare.outputs.is_release }}
      sha_tag: ${{ needs.prepare.outputs.sha_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reserve remote Git tag for this commit
        if: needs.prepare.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail

          read_remote_tag_sha() {
            git ls-remote --tags origin \
              "refs/tags/${RELEASE_TAG}" \
              "refs/tags/${RELEASE_TAG}^{}" |
              awk '
                $2 ~ /\^\{\}$/ { peeled = $1 }
                $2 !~ /\^\{\}$/ { direct = $1 }
                END { print peeled != "" ? peeled : direct }
              '
          }

          tagged_sha=$(read_remote_tag_sha)

          if [[ -n "$tagged_sha" ]]; then
            if [[ "$tagged_sha" != "$GITHUB_SHA" ]]; then
              echo "Release tag ${RELEASE_TAG} already points to ${tagged_sha}, not ${GITHUB_SHA}." >&2
              exit 1
            fi

            echo "Release tag ${RELEASE_TAG} already reserves this commit."
            exit 0
          fi

          if gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${RELEASE_TAG}" \
            -f sha="$GITHUB_SHA" >/dev/null; then
            echo "Reserved release tag ${RELEASE_TAG} for ${GITHUB_SHA}."
            exit 0
          fi

          tagged_sha=$(read_remote_tag_sha)
          if [[ "$tagged_sha" != "$GITHUB_SHA" ]]; then
            echo "Could not reserve ${RELEASE_TAG}; it now points to ${tagged_sha:-an unknown commit}." >&2
            exit 1
          fi

          echo "Release tag ${RELEASE_TAG} was concurrently reserved for this commit."

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.prepare.outputs.sha_tag }}
            type=raw,value=${{ needs.prepare.outputs.release_tag }},enable=${{ needs.prepare.outputs.is_release == 'true' }}

      - name: Build and publish frontend image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        if: needs.prepare.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
        run: |
          release_options=(
            --title "Frontend $RELEASE_TAG"
            --generate-notes
          )

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_options+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              "${release_options[@]}"
          fi

      - name: Add publication summary
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          IS_RELEASE: ${{ needs.prepare.outputs.is_release }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          {
            echo "## Published frontend container image"
            echo
            echo "### Tags"
            echo '```text'
            echo "$IMAGE_TAGS"
            echo '```'
            echo
            echo "**Digest:** \`$IMAGE_DIGEST\`"
            if [[ "$IS_RELEASE" == "true" ]]; then
              echo
              echo "**Release:** \`$RELEASE_TAG\` (from \`package.json\`)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  promote-latest:
    name: Promote latest image tag
    needs: publish
    if: github.ref == 'refs/heads/main' && needs.publish.outputs.is_release != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: publish-frontend-latest-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote current main image to latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_IMAGE_NAME: ${{ needs.publish.outputs.image_name }}
          SHA_TAG: ${{ needs.publish.outputs.sha_tag }}
        run: |
          set -euo pipefail

          current_main_sha=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            --jq '.object.sha')

          if [[ "$current_main_sha" != "$GITHUB_SHA" ]]; then
            {
              echo "## Skipped latest promotion"
              echo
              echo "Commit \`$GITHUB_SHA\` is no longer the head of \`main\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          source_image="${REGISTRY}/${PUBLISHED_IMAGE_NAME}:${SHA_TAG}"
          latest_image="${REGISTRY}/${PUBLISHED_IMAGE_NAME}:latest"

          docker buildx imagetools create \
            --tag "$latest_image" \
            "$source_image"

          {
            echo "## Promoted frontend container image"
            echo
            echo "\`$source_image\` is now available as \`$latest_image\`."
          } >> "$GITHUB_STEP_SUMMARY"
