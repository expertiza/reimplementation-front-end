name: Comment frontend coverage

on:
  workflow_run:
    workflows: ["Frontend CI"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    name: Post coverage report
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Find associated pull request
        id: pull-request
        uses: actions/github-script@v7
        with:
          script: |
            const workflowRun = context.payload.workflow_run;
            let pullRequest = workflowRun.pull_requests?.[0];

            if (!pullRequest) {
              const headOwner = workflowRun.head_repository?.owner?.login;
              const headBranch = workflowRun.head_branch;

              if (headOwner && headBranch) {
                const candidates = await github.paginate(github.rest.pulls.list, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: "open",
                  head: `${headOwner}:${headBranch}`,
                  per_page: 100,
                });
                pullRequest = candidates[0];
              }
            }

            if (!pullRequest) {
              core.info("No pull request is associated with this workflow run.");
              core.setOutput("number", "");
              core.setOutput("eligible", "false");
              return;
            }

            const { data: pullRequestDetails } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequest.number,
            });

            core.setOutput("number", pullRequestDetails.number);
            core.setOutput("eligible", String(!pullRequestDetails.draft));

            if (pullRequestDetails.draft) {
              core.info("Coverage comments are skipped for draft pull requests.");
            }

      - name: Download coverage report
        id: download
        if: steps.pull-request.outputs.eligible == 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage-comparison
          path: frontend-coverage-comparison
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Create or update coverage comment
        if: >-
          steps.pull-request.outputs.eligible == 'true' &&
          steps.download.outcome == 'success'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
          REPORT_PATH: frontend-coverage-comparison/comparison.md
        with:
          script: |
            const fs = require("fs");

            if (!fs.existsSync(process.env.REPORT_PATH)) {
              core.warning(`Coverage report not found: ${process.env.REPORT_PATH}`);
              return;
            }

            const marker = "<!-- frontend-coverage-report -->";
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.payload.workflow_run.id}`;
            let report = fs
              .readFileSync(process.env.REPORT_PATH, "utf8")
              .replaceAll("@", "@\u200b")
              .trim();

            if (report.length > 60000) {
              report = `${report.slice(0, 60000)}\n\n_Report truncated; see the workflow artifact._`;
            }

            const body = [
              marker,
              report,
              "",
              `<sub>Updated from [Frontend CI](${runUrl}).</sub>`,
            ].join("\n");
            const issueNumber = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existingComment = comments.find(
              (comment) =>
                comment.user?.type === "Bot" && comment.body?.includes(marker),
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
              core.info(`Updated coverage comment ${existingComment.id}.`);
            } else {
              const response = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
              core.info(`Created coverage comment ${response.data.id}.`);
            }
