name: Bug Report
description: Report something that is broken
labels: ["bug"]
type: bug
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: input
    id: version
    attributes:
      label: Expertiza version
      description: Example `0.1.0`
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Example `Windows 11, Node 22.13.0, npm 10.9.2, Edge 153, Docker Desktop 4.92.0`
    validations:
      required: false
    
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Be specific and include exact error output if possible.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible steps.
      placeholder: |
        1. Run `...`
        2. Run `...`
        3. Observe `...`
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: false

  - type: upload
    id: screenshots
    attributes:
      label: Upload screenshots
      description: If applicable, add screenshots to help explain your problem.
    validations:
      required: false
  
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
